version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      quality-tools:
        patterns: ['@biomejs/*', ultracite, husky, lint-staged]
      vitest:
        patterns: [vitest, '@vitest/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
