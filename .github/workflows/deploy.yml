name: Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One shared staging hostname; never cancel a deployment midway through migrations.
# Serialization also prevents an older production job finishing after a newer one.
concurrency:
  group: cloudflare-deployments
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Run shared repository gates when available
        run: |
          if [ -f scripts/check_quality.py ]; then
            python3 scripts/check_quality.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.ariadneos.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist
      - name: Apply staging migrations
        run: npx --no-install wrangler d1 migrations apply DB --env staging --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Sync configured authentication secrets
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const names = ['BETTER_AUTH_SECRET', 'SLACK_CLIENT_ID', 'SLACK_CLIENT_SECRET'];
          const secrets = Object.fromEntries(names.filter(name => process.env[name]).map(name => [name, process.env[name]]));
          if (Object.keys(secrets).length) {
            const result = spawnSync('npx', ['--no-install', 'wrangler', 'secret', 'bulk', '--env', process.env.DEPLOY_ENV], { input: JSON.stringify(secrets), encoding: 'utf8', stdio: ['pipe', 'inherit', 'inherit'] });
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          JS
        env:
          DEPLOY_ENV: staging
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
      - name: Deploy staging
        run: npx --no-install wrangler deploy --env staging --var "APP_ENV:staging" --var "RELEASE_SHA:$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify staging revision and readiness
        run: node scripts/check-deployment.mjs https://staging.ariadneos.com staging "$GITHUB_SHA"
      - name: Verify staging simulation and isolation
        run: node scripts/smoke.mjs https://staging.ariadneos.com

  production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ariadneos.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist
      - name: Apply production migrations
        run: npx --no-install wrangler d1 migrations apply DB --env production --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Sync configured authentication secrets
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const names = ['BETTER_AUTH_SECRET', 'SLACK_CLIENT_ID', 'SLACK_CLIENT_SECRET'];
          const secrets = Object.fromEntries(names.filter(name => process.env[name]).map(name => [name, process.env[name]]));
          if (Object.keys(secrets).length) {
            const result = spawnSync('npx', ['--no-install', 'wrangler', 'secret', 'bulk', '--env', process.env.DEPLOY_ENV], { input: JSON.stringify(secrets), encoding: 'utf8', stdio: ['pipe', 'inherit', 'inherit'] });
            if (result.status !== 0) process.exit(result.status ?? 1);
          }
          JS
        env:
          DEPLOY_ENV: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
      - name: Deploy production
        run: npx --no-install wrangler deploy --env production --var "APP_ENV:production" --var "RELEASE_SHA:$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify production revision and readiness
        run: node scripts/check-deployment.mjs https://ariadneos.com production "$GITHUB_SHA"
      - name: Verify canonical redirect
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('https://www.ariadneos.com/api/health?ci=1', { redirect: 'manual' });
          assert.equal(response.status, 308);
          assert.equal(response.headers.get('location'), 'https://ariadneos.com/api/health?ci=1');
          JS
