name: Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One shared staging hostname; never cancel a deployment midway through migrations.
# Serialization also prevents an older production job finishing after a newer one.
concurrency:
  group: cloudflare-deployments
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/ruff-action@146cd51f235777a9bc491eead18e0d5a4b05406a # v3
        with:
          version: '0.16.7'
          args: --version
      - run: npm ci
        env:
          HUSKY: '0'
      - run: npm exec --no -- playwright install --with-deps chromium
      - name: Run complete quality gates before deployment
        run: npm run check:repo
        env:
          HUSKY: '0'
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.ariadneos.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }}
          path: dist
      - name: Apply staging migrations
        run: npx --no-install wrangler d1 migrations apply DB --env staging --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy staging
        run: npx --no-install wrangler deploy --env staging --var "APP_ENV:staging" --var "RELEASE_SHA:$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify staging revision and readiness
        run: node scripts/check-deployment.mjs https://staging.ariadneos.com staging "$GITHUB_SHA"
      - name: Verify staging simulation and isolation
        run: node scripts/smoke.mjs https://staging.ariadneos.com

  production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ariadneos.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }}
          path: dist
      - name: Apply production migrations
        run: npx --no-install wrangler d1 migrations apply DB --env production --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy production
        run: npx --no-install wrangler deploy --env production --var "APP_ENV:production" --var "RELEASE_SHA:$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify production revision and readiness
        run: node scripts/check-deployment.mjs https://ariadneos.com production "$GITHUB_SHA"
      - name: Verify canonical redirect
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('https://www.ariadneos.com/api/health?ci=1', { redirect: 'manual' });
          assert.equal(response.status, 308);
          assert.equal(response.headers.get('location'), 'https://ariadneos.com/api/health?ci=1');
          JS
