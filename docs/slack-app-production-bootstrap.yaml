display_information:
  name: AriadneOS
  description: Discover work processes and sign in with Slack
  background_color: "#4A154B"
features:
  bot_user:
    display_name: AriadneOS
    always_online: false
oauth_config:
  redirect_urls:
    - https://ariadneos.com/api/auth/callback/slack
  scopes:
    bot:
      - channels:read
      - channels:history
      - users:read
settings:
  socket_mode_enabled: false
  token_rotation_enabled: false
